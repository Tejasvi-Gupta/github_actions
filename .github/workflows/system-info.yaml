name: System Info

on:
    push:
jobs:
    system-info:
        runs-on: ubuntu-latest
        steps:
            - name: Print OS name and kernel name
              run: |
                  uname -s
                  uname -r
            - name: Print free disk space 
              run: df -h /

            - name: Print current date and time
              run: date

            - name: Install tree
              run: |
                  sudo apt-get update
                  sudo apt-get install -y tree
            - name: Display home directory structure
              run: tree -L 2 "$HOME"

            