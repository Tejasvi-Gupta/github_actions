name: Checkout Proof

on:
    push:
    workflow_dispatch:

jobs:
    prove:
        runs-on: ubuntu-latest
        steps:
            - name: Print current folder path and lists its contents
              run: |
                echo "Current folder path ${PWD}"
                echo "Listing contents of the current folder:"
                ls -al
            - name: Checkout code
              uses: actions/checkout@v7
            - name: List contents after checkout
              run: |
                echo "Listing contents after checkout:"
                ls -al
            - name: Count number of files
              run: |
               echo "Counting number of files in the current folder:"
               file_count=$(find . -type f | wc -l)
                echo "Number of files in the current folder: ${file_count}"
            - name: Finish
              run: echo "Proof captured"
            - name: Explain the listings
              run: echo "The first listing shows the empty runner workspace before checkout, while the second shows the repository files after checkout."   
