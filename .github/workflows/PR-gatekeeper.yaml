name : PR gatekeeper
on:
    # pull_request:
    #     branches:
    #         - master
    workflow_dispatch:
jobs:
    checks:
        runs-on: ubuntu-Latest
        steps:
            - name: Print target branch
              if: github.event_name == 'pull_request'
              run: 'echo "PR is targeting branch: ${{github.base_ref}}"'

            - name: Print PR number
              if: github.event_name == 'pull_request'
              run: 'echo "PR number: ${{github.event.pull_request.number}}"'

            - name: Final status
              run: 'echo "Gatekeeper checks complete"'