name: Nightly Housekeeper
on:
    # schedule:
    #     - cron: "0 2 * * *"
    workflow_dispatch:
jobs:
    cleanup:
        runs-on: ubuntu-latest
        steps:
            - name: Print current date and time
              run: 'echo "Current date and time: ${date}"'

            - name: Print nightly cleanup message
              run: echo "Running nightly cleanup" 

            - name: Print completion message
              run: echo "Housekeeping complete"